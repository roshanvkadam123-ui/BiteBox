<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index</title>
</head>
<style>
.box {
    width: 150px;
    height: 150px;
    /* position: absolute; */
    border: 2px solid black;
    border-radius: 10px;
}
#a {
    position: absolute;
    top: 0;
    left: 0;
    background-color: #2f0707;
    z-index:3;
}
#b {
    position: absolute;
    top: 30px;
    left: 30px;
    z-index: 1;
    background-color: #2a1b5f;  
}
#c {
    position: absolute;
    top: 60px;
    left: 60px;
    z-index: 4;
    background-color: #3f2c8f;
}
#d {
    position: absolute;
    top: 90px;
    left: 90px;
    z-index: 2;
    background-color: #5a3dbe;
}

</style>
<body>
    <div class="box" id="a">1</div>
    <div class="box" id="b">2</div>
    <div class="box" id="c">3</div>
    <div class="box" id="d">4</div>
    
</body>
</html>

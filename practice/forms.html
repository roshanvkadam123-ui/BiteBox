<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms using HTML</title>
</head>
<body>
    <h2 align="center">Student Registration Form</h2>

    <form align="center" method="post">

     <label for="name">Name</label>
    <input type="text" id="Name" placeholder="Enter your name" required><br><br>
     
    <label for="Uname">Username</label>
    <input type="text" id="uname" placeholder="Enter your Username" required><br><br>
    
    <label for="email">Email:</label>
    <input type="email"id="email" placeholder="Enter your email" required><br><br>
    
    <label for="Password">Password</label>
    <input type="password" id=" Password:" placeholder="Enter your password" required><br><br>
    
    <label for="Confirm Password:">Confirm Password:</label>
    <input type="password" id="Confirm Password:" placeholder="Confirm your password" required><br><br>


    <button type="submit"> Register</button>
    </form>
     


    
</body>
</html>

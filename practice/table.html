<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in HTML</title>
</head>
<body>
    <h2 align="center">Student Data</h2>

<table border="1" align="center" width="60%" height="50%">
    <thead align="center">
        
        <tr>
            <th>student Name</th>
            <th>student Age</th>
            <th>student City</th>
        </tr>
    </thead>
    <tbody align="center">
        <tr>
            <td>roshan</td>
            <td>30</td>
            <td>New York</td>
        </tr>
        <tr>
            <td>samarth</td>
            <td>29</td>
            <td>New York</td>
        </tr>
    </tbody>
    <tfoot align="center"> >
        <tr>
            <td colspan="3">Total Students: 2</td>
        </tr>
    </tfoot>
</table>
       
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITVEDANT</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            font-family: "Times New Roman", serif;
        }

        /* Main Page */
        .container {
            width: 100%;
            min-height: 100vh;
            text-align: center;
            padding-top: 42px;
        }

        /* Top Heading */
        .heading {
            display: inline-block;
            font-size: 62px;
            font-weight: bold;
            color: #000;
            letter-spacing: -3px;

            text-shadow:
                8px 8px 7px rgba(170, 170, 130, 0.7);
        }

        /* Tagline Box */
        .tagline-box {
            width: 655px;
            height: 77px;
            margin: 43px auto 0;

            border: 3px solid #111;
            box-shadow: 11px 11px 5px rgba(170, 170, 130, 0.65);

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 25px;
        }

        .tagline {
            font-size: 19px;
            font-style: italic;
            line-height: 24px;
            color: #111;
        }

        /* Logo Area */
        .logo-box {
            width: 610px;
            height: 375px;
            margin: 77px auto 0;

            position: relative;

            box-shadow:
                12px 12px 5px rgba(170, 170, 130, 0.65);
        }

        /* Butterfly */
        .butterfly {
            position: absolute;
            left: 20px;
            top: 20px;
            width: 150px;
            height: 350px;
        }

        .body {
            position: absolute;
            left: 69px;
            top: 125px;
            width: 7px;
            height: 155px;
            background: #6b6b6b;
        }

        /* Left wings */
        .left-top {
            position: absolute;
            left: 0;
            top: 50px;
            width: 72px;
            height: 148px;
            background: #686868;
            clip-path: polygon(0 0, 100% 70%, 55% 100%, 20% 85%);
        }

        .left-bottom {
            position: absolute;
            left: 18px;
            top: 155px;
            width: 60px;
            height: 170px;
            background: #686868;
            clip-path: polygon(75% 0, 100% 42%, 55% 100%, 0 65%);
        }

        /* Right wings */
        .right-top {
            position: absolute;
            left: 72px;
            top: 50px;
            width: 72px;
            height: 148px;
            background: #b7db00;
            clip-path: polygon(100% 0, 80% 85%, 45% 100%, 0 70%);
        }

        .right-bottom {
            position: absolute;
            left: 72px;
            top: 155px;
            width: 60px;
            height: 170px;
            background: #b7db00;
            clip-path: polygon(25% 0, 100% 65%, 45% 100%, 0 42%);
        }

        /* Antennas */
        .antenna-left {
            position: absolute;
            left: 55px;
            top: 0;
            width: 55px;
            height: 130px;

            border-left: 4px solid #666;
            border-radius: 70% 0 0 0;
            transform: rotate(-20deg);
        }

        .antenna-right {
            position: absolute;
            left: 72px;
            top: 0;
            width: 55px;
            height: 130px;

            border-right: 4px solid #666;
            border-radius: 0 70% 0 0;
            transform: rotate(20deg);
        }

        .antenna-left::before,
        .antenna-right::before {
            content: "";
            position: absolute;
            width: 24px;
            height: 48px;
            border: 4px solid #666;
            border-radius: 50%;
        }

        .antenna-left::before {
            left: -27px;
            top: -12px;
            transform: rotate(-10deg);
        }

        .antenna-right::before {
            right: -27px;
            top: -12px;
            transform: rotate(10deg);
        }

        /* ITVEDANT Logo Text */
        .logo-text {
            position: absolute;
            left: 170px;
            top: 125px;

            font-family: Arial, sans-serif;
            font-size: 67px;
            font-weight: 500;
            letter-spacing: -4px;
        }

        .it {
            color: #686868;
        }

        .vedant {
            color: #b7db00;
        }

        /* Tagline under logo */
        .logo-tagline {
            position: absolute;
            right: 18px;
            bottom: 20px;

            font-family: Impact, "Arial Narrow", sans-serif;
            font-size: 31px;
            color: #666;
            letter-spacing: -1px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Main Heading -->
        <h1 class="heading">ITVEDANT</h1>

        <!-- Description -->
        <div class="tagline-box">
            <p class="tagline">
                India's Leading and Trusted IT Training Institute Offering Classroom &<br>
                Online Training
            </p>
        </div>

        <!-- Logo -->
        <div class="logo-box">

            <div class="butterfly">

                <div class="antenna-left"></div>
                <div class="antenna-right"></div>

                <div class="left-top"></div>
                <div class="left-bottom"></div>

                <div class="right-top"></div>
                <div class="right-bottom"></div>

                <div class="body"></div>

            </div>

            <div class="logo-text">
                <span class="it">IT</span><span class="vedant">VEDANT</span>
            </div>

            <div class="logo-tagline">
                Decode your dreams
            </div>

        </div>

    </div>

</body>
</html>

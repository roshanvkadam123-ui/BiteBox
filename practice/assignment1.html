<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #fff;
      padding: 10px 0;
    }

    /* Heading with black line dividers */
    .divider {
      width: 95%;
      display: flex;
      align-items: center;
      text-align: center;
      color: #e54b3c;
      font-weight: bold;
      font-size: 1.1rem;
      margin: 10px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      border-bottom: 2px solid #000;
    }

    .divider:not(:empty)::before {
      margin-right: 15px;
    }

    .divider:not(:empty)::after {
      margin-left: 15px;
    }

    /* Common image styling */
    img {
      width: 100%;
      max-width: 900px;
      height: auto;
      display: block;
    }

    /* DEFAULT (Above 700px): show desktop elements, hide mobile elements */
    .img-desktop,
    .text-desktop {
      display: block;
    }

    .divider.text-desktop {
      display: flex;
    }

    .img-mobile,
    .text-mobile {
      display: none;
    }

    /* AT OR BELOW 700px: hide desktop elements, show mobile elements */
    @media screen and (max-width: 700px) {
      .img-desktop,
      .text-desktop {
        display: none !important;
      }

      .img-mobile {
        display: block !important;
      }

      .divider.text-mobile {
        display: flex !important;
      }
    }
  </style>
</head>
<body>

  

  <!-- Image 1:  -->
  <img 
    class="img-desktop" 
    src="./assets/images/about-hero-banner.png"
    alt="about banner"
  >

  <!-- Image 2:  -->
  <img 
    class="img-mobile" 
    src="./assets/images/cart-hero-banner.png" 
    alt="cart banner"
  >

  

</body>
</html>
